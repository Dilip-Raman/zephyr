#Minimal config need ..!

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y

# HLP: boost publisher to highest-priority observer during VDED
# Without this: publisher at prio=5 can be preempted mid-VDED by
# msg_sub at prio=3. With this: publisher is temporarily raised to
# prio < 3, runs VDED atomically, then restored to prio=5.
CONFIG_ZBUS_PRIORITY_BOOST=y

# Enable msg subscriber (uses net_buf FIFO) and async listener (workqueue)
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_ASYNC_LISTENER=y

#Memory for msg subscribers

#it depends with static allocation.
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
# net_buf pool for msg subscriber copies
# VDED copies the channel message into a net_buf and enqueues it to
# each MSG_SUBSCRIBER's FIFO. Static allocation avoids heap fragmentation.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=8
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=32
CONFIG_HEAP_MEM_POOL_ADD_SIZE_ZBUS=512

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
#CONFIG_MAIN_THREAD_PRIORITY=5
