CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_I2C=y
CONFIG_GPIO=y

# MCUboot bootutil library for image structures
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_BASE64=y
CONFIG_CRC=y

# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# MCUmgr Core & Net Buffer Pool
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=384
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=8

# SMP Client Subsystem
CONFIG_SMP_CLIENT=y
CONFIG_SMP_CMD_RETRY_TIME=500
CONFIG_SMP_CMD_DEFAULT_LIFE_TIME=15

# I2C Client Transport
CONFIG_MCUMGR_TRANSPORT_I2C_CLIENT=y
CONFIG_MCUMGR_TRANSPORT_I2C_CLIENT_MTU=256
CONFIG_MCUMGR_TRANSPORT_I2C_CLIENT_POLL_MS=5
CONFIG_MCUMGR_TRANSPORT_I2C_CLIENT_POLL_RETRIES=2000

# MCUmgr Client Groups
CONFIG_MCUMGR_GRP_OS_CLIENT=y
CONFIG_MCUMGR_GRP_OS_CLIENT_ECHO=y
CONFIG_MCUMGR_GRP_OS_CLIENT_RESET=y

CONFIG_MCUMGR_GRP_IMG_CLIENT=y
CONFIG_MCUMGR_GRP_IMG_FLASH_OPERATION_TIMEOUT=20
